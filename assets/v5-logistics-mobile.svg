<svg xmlns="http://www.w3.org/2000/svg" width="390" height="560" viewBox="0 0 390 560" role="img" aria-labelledby="title desc">
<title id="title">DESSET: recorrido logístico conceptual en formato vertical</title>
<desc id="desc">Un comercio con toldo amarillo, una caja, un repartidor en motocicleta y una casa se conectan mediante un recorrido amarillo luminoso.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0F1937"/><stop offset=".5" stop-color="#0A1229"/><stop offset="1" stop-color="#080B16"/></linearGradient>
 <radialGradient id="blue"><stop stop-color="#1551D8" stop-opacity=".35"/><stop offset="1" stop-color="#1551D8" stop-opacity="0"/></radialGradient>
 <radialGradient id="warm"><stop stop-color="#FFB927" stop-opacity=".26"/><stop offset="1" stop-color="#FFB927" stop-opacity="0"/></radialGradient>
 <linearGradient id="shop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4286FC"/><stop offset=".6" stop-color="#1551D8"/><stop offset="1" stop-color="#091E65"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C3F1FF"/><stop offset=".5" stop-color="#4C96E1"/><stop offset="1" stop-color="#0E204B"/></linearGradient>
 <linearGradient id="awning" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFEDA1"/><stop offset=".5" stop-color="#FFC62F"/><stop offset="1" stop-color="#C17B0A"/></linearGradient>
 <linearGradient id="home" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6C5A"/><stop offset=".5" stop-color="#FF3328"/><stop offset="1" stop-color="#982338"/></linearGradient>
 <linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253256"/><stop offset="1" stop-color="#0C1326"/></linearGradient>
 <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="shadow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#96B6F3" stroke-opacity=".07"/></pattern>
</defs>
<rect width="390" height="560" fill="url(#bg)"/>
