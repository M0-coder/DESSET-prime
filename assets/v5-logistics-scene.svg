<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">DESSET: conexión conceptual entre cliente, comercio y reparto</title>
<desc id="desc">Escena editorial tridimensional estilizada: tres estaciones urbanas conectadas por una ruta. No representa entregas operativas.</desc>
<defs>
  <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25283A"/><stop offset="1" stop-color="#10131D"/></linearGradient>
  <linearGradient id="blueWall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3B76F0"/><stop offset=".65" stop-color="#1551D8"/><stop offset="1" stop-color="#0E2E7A"/></linearGradient>
  <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE98C"/><stop offset=".56" stop-color="#FFC62F"/><stop offset="1" stop-color="#D98B08"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF7C69"/><stop offset=".55" stop-color="#FF3328"/><stop offset="1" stop-color="#A51D29"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#A9DEFF" stop-opacity=".95"/><stop offset=".5" stop-color="#2B75D8" stop-opacity=".78"/><stop offset="1" stop-color="#0A1C51" stop-opacity=".8"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#1551D8" stop-opacity=".47"/><stop offset="1" stop-color="#1551D8" stop-opacity="0"/></radialGradient>
  <radialGradient id="warmGlow"><stop stop-color="#FFC62F" stop-opacity=".25"/><stop offset="1" stop-color="#FFC62F" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-35%" y="-35%" width="170%" height="190%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#FFFFFF" stroke-opacity=".065" stroke-width="1"/></pattern>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity=".16"/></pattern>
</defs>
