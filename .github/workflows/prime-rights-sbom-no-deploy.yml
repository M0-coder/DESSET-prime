name: DESSET Prime - rights and third-party license evidence (NO DEPLOY)
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-assets-licenses:
    name: Original asset hashes, SCA and SPDX SBOM (offline release)
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exactly the proposed commit, without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fixed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Pin and build only DESSET Prime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:site
          npm run verify:site
      - name: Audit production AND development dependencies
        run: npm audit --audit-level=high
      - name: Verify the 12 active and 2 archived original media and software ownership boundary
        run: |
          set -euo pipefail
          node --check scripts/prime-rights-license-audit.mjs
          node --test tests/prime-rights-license-audit.test.mjs
          node scripts/prime-rights-license-audit.mjs "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/prime-rights-and-sbom.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/prime-rights-and-sbom.json");if(r.outcome!=="PASS"||r.assets_checked!==12||r.archived_media_checked!==2||r.legal_title_independently_verified!==false||r.publication_authorized!==false||r.release_decision!=="NO-GO")process.exit(1)'
          test -z "$(git diff --name-only)"
      - name: Generate machine-readable SPDX SBOM from locked dependencies
        run: |
          set -euo pipefail
          npm sbom --package-lock-only --sbom-format=spdx > "$RUNNER_TEMP/prime-npm-sbom.spdx.json"
          node -e 'let x=require(process.env.RUNNER_TEMP+"/prime-npm-sbom.spdx.json");if(!x.spdxVersion||!Array.isArray(x.packages)||x.packages.length<2)process.exit(1)'
      - name: Archive audit evidence OUTSIDE static website
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desset-prime-rights-sbom-NO-GO-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prime-rights-and-sbom.json
            ${{ runner.temp }}/prime-npm-sbom.spdx.json
          retention-days: 14
          if-no-files-found: error
