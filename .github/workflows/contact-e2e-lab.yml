name: CONTACT-READY — full synthetic browser circuit (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'scripts/contact-e2e-*'
      - 'internal/contact-ready/**'
      - 'internal/contact-service/**'
      - 'internal/contact-platform/**'
      - 'scripts/contact-workerd-fixture.mjs'
      - '.github/workflows/contact-e2e-lab.yml'
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Run isolated browser circuit
        env:
          DESSET_CONTACT_SYNTHETIC_E2E: '1'
        run: |
          node --check scripts/contact-e2e-bridge.js
          node --check scripts/contact-e2e-fixture.mjs
          node --check scripts/contact-e2e-browser.mjs
          node scripts/contact-e2e-browser.mjs
      - name: Install pinned isolated D1 runtime and run same browser circuit
        env:
          DESSET_CONTACT_SYNTHETIC_E2E: '1'
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/contact-browser-d1"
          mkdir -p "$prefix"
          cp internal/contact-platform/lab/package.json internal/contact-platform/lab/package-lock.json "$prefix/"
          echo '6bfc26d5d2e17bd50953b5136e3b58ce06a437b4a6b08975ac3bb354639501a5  internal/contact-platform/lab/package-lock.json' | sha256sum -c -
          npm audit --prefix "$prefix" --audit-level=low
          npm ci --prefix "$prefix" --no-audit --no-fund --engine-strict
          cmp internal/contact-platform/lab/package-lock.json "$prefix/package-lock.json"
          node --check scripts/contact-e2e-d1-backend.mjs
          node --check scripts/contact-e2e-d1-bridge.mjs
          CONTACT_LAB_PREFIX="$prefix" node scripts/contact-e2e-browser.mjs --d1
      - name: Verify closed public package
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:site
          npm run verify:site
          node scripts/static-gate.mjs
          test ! -e dist/internal
          test ! -e dist/scripts/contact-e2e-bridge.js
          git diff --exit-code
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contact-e2e-browser-evidence
          path: reports/contact-e2e/
          if-no-files-found: warn
          retention-days: 14
