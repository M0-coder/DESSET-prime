name: CONTACT-READY — platform security boundary (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'internal/contact-platform/**'
      - 'tests/contact-platform.test.mjs'
      - '.github/workflows/contact-platform-lab.yml'
permissions:
  contents: read
jobs:
  platform-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Test platform boundary offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/contact-platform
          node --check internal/contact-platform/gates.mjs
          node --test tests/contact-platform.test.mjs | tee reports/contact-platform/tests.txt
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:site
          npm run verify:site
          node scripts/static-gate.mjs
          test ! -e dist/internal
          git diff --exit-code
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contact-platform-evidence
          path: reports/contact-platform/
          if-no-files-found: error
          retention-days: 14
