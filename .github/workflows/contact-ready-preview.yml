name: CONTACT-READY — internal preview only (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'internal/contact-ready/**'
      - 'tests/contact-ready-preview.test.mjs'
      - 'scripts/contact-ready-browser.mjs'
      - '.github/workflows/contact-ready-preview.yml'
permissions:
  contents: read
jobs:
  internal-contact-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Check isolated preview and unchanged production package
        run: |
          node --test tests/contact-ready-preview.test.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:site
          npm run verify:site
          node scripts/static-gate.mjs
          test ! -e dist/internal/contact-ready
          test ! -e dist/contact-ready.js
      - name: Test nine routes at four widths
        run: node scripts/contact-ready-browser.mjs
      - name: Save local QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contact-ready-preview-evidence
          path: reports/contact-ready/
          if-no-files-found: warn
          retention-days: 14
