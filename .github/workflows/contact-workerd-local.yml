name: CONTACT-READY — local workerd D1 integration (NO DEPLOY)
on:
  pull_request:
permissions:
  contents: read
jobs:
  local-workerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Verify and audit committed lock before installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/contact-workerd
          prefix="$RUNNER_TEMP/contact-workerd"
          mkdir -p "$prefix"
          cp internal/contact-platform/lab/package.json internal/contact-platform/lab/package-lock.json "$prefix/"
          echo '6bfc26d5d2e17bd50953b5136e3b58ce06a437b4a6b08975ac3bb354639501a5  internal/contact-platform/lab/package-lock.json' | sha256sum -c -
          cp "$prefix/package-lock.json" reports/contact-workerd/package-lock.json
          echo "CONTACT_LAB_PREFIX=$prefix" >> "$GITHUB_ENV"
          npm audit --prefix "$prefix" --audit-level=low --json > reports/contact-workerd/runtime-audit.json
      - name: Install isolated pinned local runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix "$CONTACT_LAB_PREFIX" --no-audit --no-fund --engine-strict
          cmp internal/contact-platform/lab/package-lock.json "$CONTACT_LAB_PREFIX/package-lock.json"
          npm ls --prefix "$CONTACT_LAB_PREFIX" --all > reports/contact-workerd/runtime-dependencies.txt
      - name: Execute local runtime and synthetic D1 tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/contact-workerd-fixture.mjs
          node --check scripts/contact-workerd-lab.mjs
          node scripts/contact-workerd-lab.mjs | tee reports/contact-workerd/results.txt
          git diff --exit-code
      - name: Preserve lab evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contact-workerd-local-evidence
          path: reports/contact-workerd/
          retention-days: 14
