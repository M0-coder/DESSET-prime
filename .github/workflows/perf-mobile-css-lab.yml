name: PERF-MOBILE — ordered CSS laboratory (NO DEPLOY)
on:
  pull_request:
    paths:
      - '.github/workflows/perf-mobile-css-lab.yml'
      - 'scripts/perf-mobile-css-lab.py'
      - 'scripts/perf-mobile-css-visual.mjs'
      - 'docs/PERF-MOBILE-02.md'
permissions:
  contents: read
jobs:
  paired-css-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Build approved baseline
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:site
          npm run verify:site
          node scripts/static-gate.mjs
      - name: Compare CSS cascade, geometry and mobile Lighthouse in temporary package
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          npm_config_ignore_scripts: 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/perf-css
          python3 scripts/perf-mobile-css-lab.py 2>&1 | tee reports/perf-css/experiment.log
      - name: Verify original package restored
        if: always()
        run: |
          npm run verify:site
          git diff --exit-code
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: perf-mobile-css-paired-evidence
          path: reports/perf-css/
          if-no-files-found: error
          retention-days: 14
