name: PERF-MOBILE — first-frame timing diagnostics (NO DEPLOY)
on:
  pull_request:
    paths:
      - '.github/workflows/perf-mobile-media-timing.yml'
      - 'scripts/perf-mobile-media-timing.mjs'
      - 'docs/PERF-MOBILE-03.md'
permissions:
  contents: read
jobs:
  observed-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Build and verify approved package
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:site
          npm run verify:site
          node scripts/static-gate.mjs
      - name: Observe original site only under applied mobile throttling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/perf-media-timing
          DESSET_PRIME_WEB_ROOT=dist node scripts/local-preview.mjs > reports/perf-media-timing/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ -o /dev/null
          google-chrome --version | tee reports/perf-media-timing/chrome-version.txt
          node --check scripts/perf-mobile-media-timing.mjs
          node scripts/perf-mobile-media-timing.mjs 2>&1 | tee reports/perf-media-timing/experiment.log
      - name: Verify original package unchanged
        if: always()
        run: |
          npm run verify:site
          git diff --exit-code
      - name: Preserve all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: perf-mobile-observed-timing
          path: reports/perf-media-timing/
          if-no-files-found: error
          retention-days: 14
