name: PERF-MOBILE — controlled video experiment (NO DEPLOY)
on:
  pull_request:
    paths:
      - '.github/workflows/perf-mobile-experiment.yml'
      - 'scripts/perf-mobile-lab.py'
      - 'docs/PERF-MOBILE-01.md'
permissions:
  contents: read
jobs:
  paired-video-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: Build and verify original package
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:site
          npm run verify:site
          node scripts/static-gate.mjs
      - name: Paired laboratory measurement, no publishable candidate
        env:
          npm_config_ignore_scripts: 'true'
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/perf-mobile-lab.py
      - name: Verify restored baseline package and clean tracked files
        if: always()
        run: |
          npm run verify:site
          git diff --exit-code
      - name: Preserve all raw measurements including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: perf-mobile-paired-evidence
          path: reports/perf-mobile/
          if-no-files-found: error
          retention-days: 14
