name: DESSET Prime V4.5 — QA cinética sin despliegue
on:
  push:
    branches: [design/**]
  pull_request:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
      - name: JavaScript syntax
        run: |
          node --check scripts/app.js
          node --check scripts/motion.js
          node --check scripts/browser-audit.mjs
      - name: Unit and source contracts
        run: node --test tests/*.test.mjs
      - name: Browser QA and snapshots
        run: node scripts/browser-audit.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desset-prime-v45-evidence
          path: reports/browser/
          if-no-files-found: warn
          retention-days: 14
      - name: No deployment mechanisms
        run: |
          test ! -f wrangler.toml
          test ! -f _worker.js
          test ! -d functions
